# -- General --
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set-option -g history-limit 10000

# -- Terminal / truecolor --
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:extkeys'
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- Passthrough / focus events --
set -g allow-passthrough on
set -s extended-keys on
set -g focus-events on

# -- Copy mode (vi keys + macOS clipboard) --
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# -- Tokyo Night status bar --
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26,nobold] "
set -g status-right "#[fg=#565f89]#{?client_prefix,#[fg=#7dcfff]PREFIX ,}#[fg=#565f89]%Y-%m-%d #[fg=#7aa2f7]%H:%M "
set -g status-left-length 30
setw -g window-status-current-format "#[fg=#7aa2f7,bold]#I:#W"
setw -g window-status-format "#[fg=#565f89]#I:#W"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"

# -- Key bindings --
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded~"

# -- TPM plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# -- Initialize TPM (keep this line at the very bottom) --
run '~/.tmux/plugins/tpm/tpm'
